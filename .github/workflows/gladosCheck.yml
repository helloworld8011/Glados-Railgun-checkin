name: GLaDOS daily check-in

on:
  workflow_dispatch:
  schedule:
    # 01:00/09:00 UTC = 09:00/17:00 Asia/Shanghai
    - cron: "0 1,9 * * *"

permissions:
  contents: read

concurrency:
  group: glados-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: Check in
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install requests pypushdeer

      - name: Run check-in
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          GLADOS_VERBOSE: "false"
        run: python checkin.py
